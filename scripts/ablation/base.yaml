# base.yaml —— 魔改6 消融评测基础配置
# 由 scripts/ablation/_run_one.py 加载，再与版本 overlay + 运行时键递归合并。
# 与 kimi-win.yaml 的差异：
#   1. environment.shell 显式 "bash"（魔改0 的可配置 shell）——绕开 cmd.exe 挂死风险类
#   2. instance_template 环境通告按 Git Bash 语义重写（不再教 cmd 原生命令）
#   3. on_uncaught_exception: controlled_exit + wall_time_limit_seconds（批跑护栏）

agent:
  system_template: |
    You are a helpful assistant that can interact with a computer.
  instance_template: |
    Complete the following task: {{task}}

    ## Environment notice (IMPORTANT - read before running any command)

    - Commands are executed by **Git Bash (POSIX shell) on Windows**:
      `ls`, `cat`, `grep`, `sed`, `python` etc. work natively.
    - Work ONLY inside the current directory (the task files are here). Use relative paths.
    - `python` is Python 3.13 with stdlib only. Do NOT pip install anything unless the
      task explicitly says otherwise.
    - Every command runs in a fresh subshell: `cd` and environment variables do not persist.
    - NEVER dump whole large files into output. View targeted ranges only, e.g.
      `sed -n '10,60p' path/to/file`. Reading a >300-line file end-to-end wastes budget.

    ## Budget rules (HARD)

    - You have a step limit and a cost limit. Be direct: explore minimally, then produce the deliverable.
    - Do NOT re-read files you have already seen. Do NOT open unrelated modules "for context".
    - If a command fails twice for the same reason, change your approach — do not repeat it.
    - Before finishing, verify your deliverable exists and is complete, then output a
      one-paragraph summary, and finish with exactly:
      `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
      (this must be its own command; after it you cannot continue working on this task)

    ## Output format

    Each response: 1-3 sentences of reasoning, then exactly one bash tool call.

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>
  step_limit: 30
  cost_limit: 0.5
  wall_time_limit_seconds: 600
  on_uncaught_exception: controlled_exit

environment:
  shell: bash
  timeout: 60
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'

model:
  model_name: moonshot/kimi-k2.6
  observation_template: |
    {%- if output.output | length < 10000 -%}
    {
      "returncode": {{ output.returncode }},
      "output": {{ output.output | tojson }}
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- else -%}
    {
      "returncode": {{ output.returncode }},
      "output_head": {{ output.output[:5000] | tojson }},
      "output_tail": {{ output.output[-5000:] | tojson }},
      "elided_chars": {{ output.output | length - 10000 }},
      "warning": "Output too long."
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- endif -%}
  format_error_template: |
    {% if finish_reason is defined and (finish_reason == "length" or (finish_reason == "tool_calls" and not has_tool_calls)) -%}
    Your previous response reached the output token limit (finish_reason={{ finish_reason }}) before you produced a tool call, so it was cut off. Respond more concisely and finish with exactly one bash tool call. If you need to think more, do so briefly.
    {%- else -%}
    Tool call error:

    <error>
    {{error}}
    </error>

    Here is general guidance on how to submit correct toolcalls:

    Every response needs to use the 'bash' tool at least once to execute commands.

    Call the bash tool with your command as the argument:
    - Tool: bash
    - Arguments: {"command": "your_command_here"}

    If you want to end the task, please issue the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
    without any other command.
    {%- endif %}
  model_kwargs:
    drop_params: true
