prompt: |
  本仓库的 CI 全红：`ModuleNotFoundError: No module named 'retry_kit'`。
  背景：retry_kit 原是内部 pip 包（backoff 重试装饰器），拆仓后未随仓分发；
  README.md 里有完整说明和硬性约束，先读它。

  请让 `python -m pytest test_exporter.py -q` 全绿。

  硬性约束（README 中也有）：
  - 不得引入任何第三方依赖，不得 pip install（内部源已下线，装不到的）；
  - send 的重试语义必须保留（最多 times 次、间隔 delay 秒、失败抛最后一次异常）；
  - 其余函数行为不变。

  完成后：输出一段修复说明（选了哪条路、为什么），并以
  `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` 结束（单独执行）。
bucket: deadend
