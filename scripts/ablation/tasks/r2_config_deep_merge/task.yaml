prompt: |
  服务配置加载器有个分层合并 bug：三层配置（base < 环境 < 实例）叠加时，
  **第三层的兄弟键会互相挤掉**——比如环境层和实例层各改了同一个二级配置块的
  不同键，最后只剩实例层改的那个键，环境层的改动丢了。

  请排查并修复 mergecfg.py 中的回归。

  约束：
  - 不得改变 deep_merge 的签名；文件 docstring 记录了完整契约
    （任意深度递归合并、不改入参、标量整体覆盖）；
  - 修复范围仅限本模块，不引入新依赖。

  验证：`python -m pytest test_mergecfg_public.py -q` 必须全绿（这只是基础测试，
  交付后会在更深的嵌套用例上做隐藏验收）。

  完成后：输出一段修复说明（根因 + 修法），并以
  `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
  结束（此命令必须单独执行，之后不能再继续操作）。
