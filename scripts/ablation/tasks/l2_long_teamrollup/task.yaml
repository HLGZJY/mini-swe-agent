prompt: |
  容量规划团队要按团队聚合错误：给定 services.json（服务→别名映射）、
  teams.json（团队→svc_id 列表）和 logs/ 下 8 天的 capsvc 日志，生成 report.txt——

  口径（验收逐行比对，一个字符都不能差）：
  - 只统计 ERROR 行中 code=**E41yy** 的事件（E41xx / E43yy / E52xx 都不算）；
  - 日志里的 [ref] 可能是 svc_id，也可能是任一别名，必须先归并到服务，
    再经 teams.json 映射到**团队**；
  - 输出所有命中次数 > 0 的团队：按团队名升序；
  - 输出格式：每行 `团队名:次数`，无多余空格，无表头。

  提示：日志较大（8 个文件 × 800 行），不要整文件 cat，用 grep 提取 ERROR 行即可。

  验证：report.txt 放在本目录（workdir 根）。交付后按上述口径逐行比对。

  完成后：输出一段统计说明，并以
  `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
  结束（此命令必须单独执行，之后不能再继续操作）。
bucket: long
